name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Repo hygiene
        run: uv run python utils/check_repo_hygiene.py

      - name: Security scan (bandit)
        run: uv run bandit -q -r bot -ll

      - name: Import check
        run: |
          uv run python -c "import bot"
          uv run python -c "from bot.core.bot import LLMBot"
          uv run python -c "from bot.router import Router"

      - name: Run tests (unit only)
        run: uv run pytest -q --tb=short -m "not integration"

      - name: Config validation smoke
        run: |
          export DISCORD_TOKEN=fake_token_smoketest
          export OPENAI_API_KEY=fake_key_smoketest
          export COMMAND_PREFIX="!"
          export BOT_SPEAKS_ONLY_WHEN_SPOKEN_TO=true
          export VISION_ENABLED=false
          export TTS_ENABLED=false
          export PERSISTENT_MEMORY_ENABLE=false
          export RAG_ENABLED=false
          uv run python -c "from bot.config import load_config; cfg = load_config(); assert 'COMMAND_PREFIX' in cfg; print('Config validation: OK')"
